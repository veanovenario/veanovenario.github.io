<div style="{{ wrapStyle }}">

  <!-- ================= SIDEBAR: photo, name, nav, socials ================= -->
  <aside style="{{ sidebarStyle }}">
    <div>
      <div style="{{ sidebarTopStyle }}">
        <a href="#top" style="{{ photoWrapStyle }}">
          <img src="83f74dd1-2f63-4a7c-a819-eeb068fc4557" alt="Vea Novenario" style="{{ photoStyle }}">
        </a>
        <a href="#top" style="color:var(--pf-text,#E8EDF2)">
          <h1 style="{{ nameStyle }}">Vea Novenario</h1>
        </a>
        <h2 style="{{ roleStyle }}">Software Engineer &amp; Technical Lead</h2>
        <sc-if value="{{ showBlurb }}" hint-placeholder-val="{{ true }}">
          <p style="margin:16px 0 0;max-width:280px;font-size:14px;line-height:1.6;color:var(--pf-body,#A9B4C0);text-wrap:pretty">Building software that runs every day, from consumer apps to rail systems</p>
        </sc-if>
      </div>

      <nav style="{{ navStyle }}">
        <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="4">
          <a href="{{ n.href }}" sc-camel-on-click="{{ n.onClick }}" style="{{ n.style }}">
            <span style="{{ n.numStyle }}">{{ n.num }}</span>
            <span>{{ n.label }}</span>
          </a>
        </sc-for>
        <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
          <button type="button" sc-camel-on-click="{{ toggleMode }}" style="{{ toggleStyle }}">{{ modeLabel }}</button>
        </sc-if>
      </nav>
    </div>

    <div style="{{ socialStyle }}">
      <a href="https://github.com/veanovenario" target="_blank" rel="noopener" style="{{ socialLinkStyle }}">GitHub</a>
      <a href="https://linkedin.com/in/veanovenario" target="_blank" rel="noopener" style="{{ socialLinkStyle }}">LinkedIn</a>
      <button type="button" sc-camel-on-click="{{ toggleMode }}" style="{{ toggleStyle }}">{{ modeLabel }}</button>
    </div>
  </aside>

  <main id="top" style="{{ mainStyle }}">

    <!-- ================= ABOUT SECTION ================= -->
    <section id="about" style="{{ sectionStyle }}">
      <div style="{{ eyebrowRow }}">
        <span style="{{ eyebrowNum }}">01</span>
        <span style="{{ eyebrowLabel }}">About</span>
      </div>
      <p style="margin:0;max-width:640px;font-size:18px;line-height:1.7;color:var(--pf-body,#A9B4C0);text-wrap:pretty">
        I turn complex engineering problems into software that works.
        Over a decade of experience across mobile, desktop, and web platforms, with 48+ shipped projects.
        Currently, I lead MONIDOOR, an HMI software suite for rail transit systems, from architecture and requirements through coding, release, and post-launch support.
      </p>
        <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.08em;color:var(--pf-muted,#8B98A5)">
        <span style="padding:7px 12px;border:1px solid var(--pf-line2,#232A31);border-radius:2px">Certified ScrumMaster® (CSM®)</span>
        <span style="padding:7px 12px;border:1px solid var(--pf-line2,#232A31);border-radius:2px">Full SDLC ownership</span>
        <span style="padding:7px 12px;border:1px solid var(--pf-line2,#232A31);border-radius:2px">SG · MY · AU · IN · TH · TW · CA · PH</span>
      </div>

      <div style="{{ metricsGrid }}">
        <sc-for list="{{ metrics }}" as="m" hint-placeholder-count="3">
          <div style="{{ m.cardStyle }}">
            <div style="font-size:40px;font-weight:600;letter-spacing:-0.03em;color:var(--pf-accent,#C6F24E);line-height:1">{{ m.value }}</div>
            <div style="margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--pf-text,#E8EDF2)">{{ m.label }}</div>
            <p style="margin:10px 0 0;font-size:13px;line-height:1.55;color:var(--pf-muted,#8B98A5);text-wrap:pretty">{{ m.desc }}</p>
          </div>
        </sc-for>
      </div>
    </section>

    <!-- ================= WORK SECTION: project cards ================= -->
    <section id="work" style="{{ sectionStyle }}">
      <div style="{{ eyebrowRow }}">
        <span style="{{ eyebrowNum }}">02</span>
        <span style="{{ eyebrowLabel }}">Work</span>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px">
        <sc-for list="{{ filters }}" as="f" hint-placeholder-count="4">
          <button type="button" sc-camel-on-click="{{ f.onClick }}" style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;padding:8px 14px;border-radius:2px;cursor:pointer;border:1px solid {{ f.bd }};background:{{ f.bg }};color:{{ f.fg }}">{{ f.label }}</button>
        </sc-for>
      </div>

      <sc-for list="{{ projects }}" as="p" hint-placeholder-count="6">
        <article style="border-top:1px solid var(--pf-line,#1C2228)">
          <div sc-camel-on-click="{{ p.toggle }}" style="{{ projectRowStyle }}">
            <div style="{{ thumbStyle }}">
              <sc-if value="{{ p.hasImg }}" hint-placeholder-val="{{ false }}">
                <img src="{{ p.img }}" alt="{{ p.name }}" style="width:100%;height:100%;object-fit:cover;object-position:top center">
              </sc-if>
            </div>
            <div>

  toggleMode = () => this.setState(s => ({ mode: s.mode === "dark" ? "light" : "dark" }));

  openLightbox = (idx) => () => this.setState({ lightbox: idx });
  closeLightbox = () => this.setState({ lightbox: -1 });
  stepLightbox = (dir) => (e) => {
    e.stopPropagation();
    const withImg = ARCHIVE.map((a, i) => i).filter(i => ARCHIVE[i].img);
    const pos = withImg.indexOf(this.state.lightbox);
    const next = withImg[(pos + dir + withImg.length) % withImg.length];
    this.setState({ lightbox: next });
  };

  applyPalette() {
    const name = this.state.mode === "light" ? "Latte light & blue" : "Slate & signal blue";
    const p = PALETTES[name] || PALETTES["Slate & signal blue"];
    const root = document.documentElement;
    Object.keys(p).forEach(k => root.style.setProperty("--pf-" + k, p[k]));
    const a = this.props.accentOverride;
    if (a) {
      root.style.setProperty("--pf-accent", a);
      root.style.setProperty("--pf-accent-hi", a);
    }
  }

  checkMobile = () => {
    const isMobile = window.innerWidth < 900;
    if (isMobile !== this.state.isMobile) this.setState({ isMobile });
  };

  onScroll = () => {
    let current = SECTIONS[0].id;
    for (const s of SECTIONS) {
      const el = document.getElementById(s.id);
      if (el && el.getBoundingClientRect().top - 140 <= 0) current = s.id;
    }
    if (current !== this.state.active) this.setState({ active: current });
  };

  scrollToSection = (id) => (e) => {
    e.preventDefault();
    const el = document.getElementById(id);
    if (!el) return;
    const offset = this.state.isMobile ? 88 : 24;
    const top = el.getBoundingClientRect().top + window.scrollY - offset;
    window.scrollTo({ top: top, behavior: "smooth" });
  };

  componentDidMount() {
    this.applyPalette();
    this.checkMobile();
    window.addEventListener("resize", this.checkMobile);
    window.addEventListener("scroll", this.onScroll, { passive: true });
    this.onScroll();
  }

  componentWillUnmount() {
    window.removeEventListener("resize", this.checkMobile);
    window.removeEventListener("scroll", this.onScroll);
  }

  componentDidUpdate() { this.applyPalette(); }

  renderVals() {

    const isMobile = this.state.isMobile;
    const list = PROJECTS.filter(p => filter === "all" || p.roles.indexOf(filter) !== -1);

    const wrapStyle = { background: "var(--pf-bg,#0B0D10)", color: "var(--pf-text,#E8EDF2)", minHeight: "100vh", display: "flex", flexDirection: isMobile ? "column" : "row" };

    const sidebarStyle = isMobile
      ? { width: "100%", position: "sticky", top: 0, zIndex: 40, padding: "18px 24px", background: "var(--pf-blur,rgba(11,13,16,0.86))", backdropFilter: "blur(12px)", borderBottom: "1px solid var(--pf-line,#1C2228)", display: "flex", flexDirection: "column", gap: "12px" }
      : { width: "290px", flexShrink: 0, position: "sticky", top: 0, height: "100vh", padding: "64px 40px", display: "flex", flexDirection: "column", justifyContent: "space-between", borderRight: "1px solid var(--pf-line,#1C2228)" };

    const sidebarTopStyle = isMobile ? { display: "flex", alignItems: "center", gap: "12px" } : {};
    const photoWrapStyle = { display: isMobile ? "block" : "block", marginBottom: isMobile ? "0" : "20px", flexShrink: 0 };
    const photoSize = isMobile ? "40px" : "72px";
    const photoStyle = { width: photoSize, height: photoSize, borderRadius: "50%", objectFit: "cover", filter: "grayscale(0.15)", border: "1px solid var(--pf-line2,#232A31)" };
    const nameStyle = { margin: 0, fontSize: isMobile ? "20px" : "28px", fontWeight: 600, letterSpacing: "-0.02em" };
    const roleStyle = { margin: isMobile ? "0" : "8px 0 0", fontSize: isMobile ? "12px" : "14px", fontWeight: 400, color: "var(--pf-muted,#8B98A5)" };

    const navStyle = isMobile
      ? { display: "flex", gap: "18px", overflowX: "auto", marginTop: "4px" }
      : { display: "flex", flexDirection: "column", gap: "14px", marginTop: "40px" };

    const navItems = SECTIONS.map(s => {
      const active = this.state.active === s.id;
      return {
        href: "#" + s.id,
        num: s.num,
        label: s.label,
        onClick: this.scrollToSection(s.id),
        style: { display: "flex", alignItems: "center", gap: "10px", whiteSpace: "nowrap", fontFamily: "'JetBrains Mono',monospace", fontSize: "12px", letterSpacing: "0.06em", color: active ? "var(--pf-accent,#C6F24E)" : "var(--pf-muted,#8B98A5)" },
        numStyle: { color: active ? "var(--pf-accent,#C6F24E)" : "var(--pf-faint,#5F6C78)" }
      };
    });

    const socialStyle = isMobile ? { display: "none" } : { display: "flex", flexDirection: "column", gap: "10px", marginTop: "32px", paddingTop: "24px", borderTop: "1px solid var(--pf-line,#1C2228)" };
    const socialLinkStyle = { fontFamily: "'JetBrains Mono',monospace", fontSize: "11px", letterSpacing: "0.06em", color: "var(--pf-muted,#8B98A5)" };

    const mainStyle = { flex: 1, minWidth: 0, padding: isMobile ? "0 20px" : "0 56px" };
    const sectionStyle = { padding: isMobile ? "56px 0" : "96px 0", borderBottom: "1px solid var(--pf-line,#1C2228)" };
    const contactSectionStyle = { padding: isMobile ? "56px 0 72px" : "96px 0 120px" };

    const eyebrowRow = { display: "flex", alignItems: "baseline", gap: "10px", marginBottom: "28px", fontFamily: "'JetBrains Mono',monospace" };
    const eyebrowNum = { fontSize: "12px", color: "var(--pf-accent,#C6F24E)" };
    const eyebrowLabel = { fontSize: "12px", letterSpacing: "0.18em", textTransform: "uppercase", color: "var(--pf-muted,#8B98A5)" };

    const metricsGrid = { display: "grid", gridTemplateColumns: isMobile ? "1fr" : "repeat(3,1fr)", gap: isMobile ? "24px" : "0", marginTop: "48px" };
    const cardBase = { padding: isMobile ? "0" : "0 28px 0 0", borderRight: isMobile ? "none" : "1px solid var(--pf-line,#1C2228)" };

    const projectRowStyle = { display: "grid", gridTemplateColumns: isMobile ? "1fr" : "220px 1fr 28px", gap: isMobile ? "16px" : "32px", alignItems: "start", padding: "28px 0", cursor: "pointer" };
    const thumbStyle = { aspectRatio: "16/10", background: "var(--pf-thumb,#12161B)", border: "1px solid var(--pf-line,#1C2228)", borderRadius: "3px", overflow: "hidden", display: "flex", alignItems: "center", justifyContent: "center" };
    const detailStyle = { display: "grid", gridTemplateColumns: isMobile ? "1fr" : "220px 1fr", gap: isMobile ? "0" : "32px", padding: "0 0 40px" };
    const archiveGrid = { display: "grid", gridTemplateColumns: isMobile ? "1fr" : "repeat(2,1fr)", gap: "0 48px" };

    return {
      wrapStyle, sidebarStyle, sidebarTopStyle, photoWrapStyle, photoStyle, nameStyle, roleStyle, showBlurb: !isMobile, isMobile,
      navStyle, navItems, socialStyle, socialLinkStyle,
      mainStyle, sectionStyle, contactSectionStyle, eyebrowRow, eyebrowNum, eyebrowLabel,
      metricsGrid, projectRowStyle, thumbStyle, detailStyle, archiveGrid,
      metrics: [
        { value: "17+", label: "Years of experience", desc: "Professional software work driving end-to-end delivery of multi-platform systems into production across mobile, web, and desktop.", cardStyle: cardBase },
        { value: "14+", label: "Years of tech leadership", desc: "Tech Lead on multi-platform releases, Solutions Architect on 13+ solutions, and Software Engineering Lead growing teams.", cardStyle: cardBase },
        { value: "48+", label: "Projects launched", desc: "Complete systems across multiple stacks and industries, each deployed to real customer environments in daily operational use.", cardStyle: cardBase }
      ],
      filters: FILTERS.map(f => ({
        label: f.label,
        bg: filter === f.key ? "var(--pf-accent,#C6F24E)" : "transparent",
        fg: filter === f.key ? "var(--pf-bg,#0B0D10)" : "var(--pf-muted,#8B98A5)",
        bd: filter === f.key ? "var(--pf-accent,#C6F24E)" : "var(--pf-line2,#232A31)",
        onClick: () => this.setState({ filter: f.key })
      })),
      projects: list.map(p => ({
        ...p,
        hasImg: true,
        open: !!this.state.open[p.id],
        sign: this.state.open[p.id] ? "−" : "+",
        toggle: () => this.setState(s => ({ open: { ...s.open, [p.id]: !s.open[p.id] } }))
      })),
      archive: ARCHIVE.map((a, i) => ({ ...a, onOpen: a.img ? this.openLightbox(i) : undefined, cursor: a.img ? "pointer" : "default" })),
      lightboxOpen: this.state.lightbox >= 0,
      lightboxImg: this.state.lightbox >= 0 ? ARCHIVE[this.state.lightbox].img : "",
      lightboxName: this.state.lightbox >= 0 ? ARCHIVE[this.state.lightbox].name : "",
      lightboxStack: this.state.lightbox >= 0 ? ARCHIVE[this.state.lightbox].stack : "",
      closeLightbox: this.closeLightbox,
      prevLightbox: this.stepLightbox(-1),
      nextLightbox: this.stepLightbox(1),
      stopClick: (e) => e.stopPropagation(),
      modeLabel: this.state.mode === "light" ? "Dark mode" : "Light mode",
      toggleMode: this.toggleMode,
      toggleStyle: {
        fontFamily: "'JetBrains Mono',monospace", fontSize: "11px", letterSpacing: "0.06em",
        color: "var(--pf-muted,#8B98A5)", background: "none", border: "1px solid var(--pf-line2,#232A31)",
        borderRadius: "2px", padding: "6px 10px", cursor: "pointer", textAlign: "left",
        marginTop: isMobile ? "0" : "16px"
      }
    };
  }
}

<\/script>


</body></html>
    </script>
  </body>
